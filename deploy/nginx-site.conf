# Įrankinė per visą serverį (vietoj roadgrader).
#   cp deploy/nginx-site.conf /etc/nginx/sites-available/toolbox
#   ln -sf /etc/nginx/sites-available/toolbox /etc/nginx/sites-enabled/toolbox
#   (pašalinkite seną roadgrader nuorodą iš sites-enabled)  ->  nginx -t && systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 500m;
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
